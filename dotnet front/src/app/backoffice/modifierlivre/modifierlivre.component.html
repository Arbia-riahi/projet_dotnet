<div class="container mt-4 ml-5 mr-5">
  <h2>✏️ Modifier un Livre</h2>

  <form [formGroup]="livreForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
    <div class="row mb-3">
      <div class="col-lg-6">
        <label>Titre</label>
        <input type="text" class="form-control" formControlName="titre">
      </div>

      <div class="col-lg-6">
        <label>Auteur</label>
        <input type="text" class="form-control" formControlName="auteur">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-lg-6">
        <label>Année</label>
        <input type="number" class="form-control" formControlName="annee">
      </div>

      <div class="col-lg-6">
        <label>Genre</label>
        <input type="text" class="form-control" formControlName="genre">
      </div>
      
    </div>
<div class="row mb-3">
  <div class="col-lg-6">
    <label>Prix</label>
    <input type="number" step="0.01" class="form-control" formControlName="prix">
  </div>

   <div class="col-lg-6">
        <label>Image actuelle :</label><br>
        <img *ngIf="imageUrl" [src]="imageUrl" class="rounded shadow-sm mt-2" width="150">
      </div>
</div>

    <div class="row mb-3">
     

      <div class="col-lg-6">
        <label>Nouvelle image (facultatif)</label>
        <input type="file" class="form-control" (change)="onFileChange($event)">
      </div>
    </div>

    <button class="btn btn-primary mt-3" type="submit">Enregistrer</button>
  </form>
</div>
