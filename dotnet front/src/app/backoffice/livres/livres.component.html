<div class="container mt-4">
  <h2 class="text-center mb-4">📚 Gestion des Livres</h2>

  <!-- 🔍 Barre de recherche + bouton ajout -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <input type="text" [(ngModel)]="searchTerm" (input)="filterBooks()"
           class="form-control w-50" placeholder="🔍 Rechercher un livre...">
    <button class="btn btn-primary" (click)="ajouterLivre()">➕ Ajouter Livre</button>
  </div>

  <!-- 🧾 Tableau -->
  <div class="table-responsive">
    <table class="table table-striped table-bordered table-hover text-center">
      <thead class="table-dark">
        <tr>
          <th>📷photo </th>
          <th>📖 Titre</th>
          <th>✍️ Auteur</th>
          <th>📅 Année</th>
          <th>🏷 Genre</th>
          <th>💰 Prix</th>
          <th>⚙️ Options</th>
        </tr>
      </thead>
      <tbody>
        
          <tr *ngFor="let livre of paginatedLivres">

          <td>
            <img *ngIf="livre.imageUrl" [src]="'http://localhost:5044/' + livre.imageUrl"
                 width="60" height="60" class="rounded border shadow-sm">
          </td>
          <td>{{ livre.titre }}</td>
          <td>{{ livre.auteur }}</td>
          <td>{{ livre.annee }}</td>
          <td>{{ livre.genre }}</td>
          <td>{{ livre.prix }} DT</td>
          <td>
            <button class="btn btn-sm btn-warning me-2" (click)="modifierLivre(livre.id)">
              ✏️ Modifier
            </button>
           <button class="btn btn-sm btn-danger me-2" (click)="supprimerLivre(livre.id)">
  🗑️ Supprimer
</button>

          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


<!-- ⬅️➡️ Pagination -->
<div class="d-flex justify-content-between align-items-center mt-3">
  <button class="btn btn-outline-primary" [disabled]="currentPage === 1" (click)="prevPage()">⬅️ Précédent</button>
  <div>Page {{ currentPage }} / {{ totalPages }}</div>
  <button class="btn btn-outline-primary" [disabled]="currentPage === totalPages" (click)="nextPage()">Suivant ➡️</button>
</div>
