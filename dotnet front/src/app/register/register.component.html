
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
       
        body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #003366, #0059b3);
    margin: 0;
    height: 100vh;
    display: grid;
    justify-content: center;
    align-items: center;
    color: #fff;
    height:600px;
    width: 1270px;
          
}

       .container {
            display: flex;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width:800px;
            height:500px
            
        }

        .left-section {
            background: linear-gradient(135deg, #004080, #0066cc);
            color: #fff;
            padding: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .left-section img {
            width: 130px;
            margin-bottom: 20px;
        }

        .left-section h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .left-section p {
            font-size: 1rem;
            text-align: center;
        }

        .right-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-section h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            color: #004080;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group input {
          display:flex;
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            color: #333;
        }

        .form-group input:focus {
            border-color: #0066cc;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 102, 204, 0.5);
        }

      .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #004080, #0066cc);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #003366, #0059b3);
        }

        .extra-links {
            text-align: center;
            margin-top: 20px;
        }

        .extra-links a {
            color: #004080;
            text-decoration: none;
            font-size: 0.9rem;
            margin: 0 10px;
            transition: color 0.3s;
        }

        .extra-links a:hover {
            color: #0066cc;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        .social-login a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: #f1f1f1;
            border-radius: 50%;
            color: #333;
            font-size: 1.1rem;
            text-decoration: none;
            transition: background 0.3s, color 0.3s;
        }

        .social-login a:hover {
            background: #004080;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Left Section -->
    <div class="left-section">
        <img src="../../assets/bookstore.jpg" alt="">
         <h4>Bienvenue a RIAHI Store</h4>
        <p>Ta bibliothèque, toujours ouverte : choisis un livre, c’est parti pour l’aventure !</p>>
    </div>

    <!-- Right Section -->
    <div class="right-section">
        <h2>Créer un compte</h2>
       <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

  <div style="display: flex; gap: 20px; margin-bottom: 18px;">
    <div style="flex: 1;">
      <label>Nom</label>
      <input type="text" class="form-control" formControlName="nom" placeholder="votre nom ..">
    </div>
    <div style="flex: 1;">
      <label>Prénom</label>
      <input type="text" class="form-control" formControlName="prenom" placeholder="votre prenom..">
    </div>
  </div>

  <div style="display: flex; gap: 20px; margin-bottom: 18px;">
    <div style="flex: 1;">
      <label>Email</label>
      <input type="email" class="form-control" formControlName="email" placeholder="votre Email...">
    </div>
    <div style="flex: 1;">
      <label>Téléphone</label>
      <input type="text" class="form-control" formControlName="telephone" placeholder="votre numéro ...">
    </div>
  </div>

  <div style="display: flex; gap: 20px; margin-bottom: 18px;">
    <div style="flex: 1;">
      <label>Mot de passe</label>
      <input type="password" class="form-control" formControlName="password" placeholder="votre MDP...">
    </div>
   
  </div>

 
  <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
  
</form>

      
        <div class="extra-links">
            <a class="small" [routerLink]="['/login']">Vous avez déjà un compte ? Connectez-vous !</a>
        </div>
    </div>
</div>
</body>
</html>
